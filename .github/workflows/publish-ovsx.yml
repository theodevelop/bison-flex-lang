name: Publish to Open VSX

on:
  push:
    tags:
      - "v*"

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_pat: ${{ steps.check.outputs.has_pat }}
    steps:
      - id: check
        run: |
          if [ -z "${{ secrets.OVSX_PAT }}" ]; then
            echo "has_pat=false" >> $GITHUB_OUTPUT
          else
            echo "has_pat=true" >> $GITHUB_OUTPUT
          fi

  publish-ovsx:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_pat == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: npx vsce package

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish *.vsix --pat "$OVSX_PAT"
